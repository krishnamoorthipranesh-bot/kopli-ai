services:
  - type: web
    name: kopli-ai
    env: node
    buildCommand: npm run build
    startCommand: npm start
    repo: https://github.com/krishnamoorthipranesh-bot/kopli-ai.git
    branch: master
    envVars:
      - key: DATABASE_URL
        fromSecret: true
      - key: GROQ_API_KEY
        fromSecret: true
      - key: TAVILY_API_KEY
        fromSecret: true
      - key: STABILITY_API_KEY
        fromSecret: true
      - key: RESEND_API_KEY
        fromSecret: true
      - key: SESSION_SECRET
        fromSecret: true
      - key: KOPLI_ADMIN_SECRET
        fromSecret: true
      - key: APP_URL
        value: https://kopli-ai-1.onrender.com
