<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080b14" />
    <meta name="description" content="FRIDAY AI — Your Personal AI Intelligence. Think, create, research and build with your personal AI assistant." />
    <meta property="og:title" content="FRIDAY AI — Your Personal AI Intelligence" />
    <meta property="og:description" content="A premium personal AI workspace created by Pranesh KK." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/png" href="/assets/favicon.svg" />
    <link rel="apple-touch-icon" href="/assets/friday-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" as="image" href="/assets/favicon.svg" />
    <title>FRIDAY AI — Your Personal AI Intelligence</title>
    <style>
      html, body, #root { min-width: 320px; min-height: 100%; margin: 0; }
      .startup-screen { min-height: 100vh; display: grid; place-content: center; justify-items: center; gap: 14px; background: radial-gradient(ellipse at 50% 36%, #172542 0, #080b14 62%); color: #dbeafe; font: 500 13px/1.4 Inter, system-ui, sans-serif; letter-spacing: .04em; }
      .startup-logo-frame { width: 112px; aspect-ratio: 1; padding: 10px; display: grid; place-items: center; border: 1px solid rgba(164, 201, 255, .45); border-radius: 50%; background: linear-gradient(145deg, rgba(255,255,255,.24), rgba(255,255,255,.04)); box-shadow: inset 0 1px 1px rgba(255,255,255,.5), 0 16px 48px rgba(42, 105, 214, .2); animation: startupFloat 3.2s ease-in-out infinite; }
      .startup-logo-frame img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 0 16px rgba(34,211,238,.28)); }
      @keyframes startupFloat { 50% { transform: translateY(-5px); } }
      @media (prefers-reduced-motion: reduce) { .startup-logo-frame { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="startup-screen" role="status" aria-live="polite"><div class="startup-logo-frame"><img src="/assets/friday-logo.svg" alt="FRIDAY AI" /></div><span>Loading FRIDAY AI</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
