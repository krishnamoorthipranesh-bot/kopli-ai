name: Refresh audited dependency lockfile

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - ".github/workflows/dependency-lock-refresh.yml"

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          token: ${{ secrets.GH_PAT }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile
        run: npm install --package-lock-only --include=dev
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Commit regenerated lockfile
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): refresh audited npm lockfile"
          git push origin "HEAD:${HEAD_REF}"
