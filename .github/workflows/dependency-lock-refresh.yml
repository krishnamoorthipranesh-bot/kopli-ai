name: Refresh audited dependency lockfile

on:
  pull_request:
    branches: [master]
    paths:
      - "package.json"
      - ".github/workflows/dependency-lock-refresh.yml"

permissions:
  contents: read

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regenerate lockfile
        run: npm install --package-lock-only --include=dev
      - name: Install locked dependencies
        run: npm ci --include=dev
      - name: Fail on high or critical vulnerabilities
        run: npm audit --audit-level=high
      - name: Type check
        run: npx tsc --noEmit
      - name: Tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Upload verified lockfile
        uses: actions/upload-artifact@v4
        with:
          name: kopli-ai-audited-package-lock
          path: package-lock.json
          if-no-files-found: error
