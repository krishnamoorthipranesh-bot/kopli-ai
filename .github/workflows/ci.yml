name: CI

on:
  push:
    branches: [master, feature/six-repo-upgrade]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Dependency security audit
        run: npm run audit
      - name: Lint
        run: npm run lint --if-present
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test --if-present
      - name: Build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/kopli_ci
        run: npm run build
