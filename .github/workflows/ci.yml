name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --include=dev
      - name: Dependency vulnerability inventory (non-blocking)
        continue-on-error: true
        run: |
          npm audit --json > /tmp/kopli-npm-audit.json || true
          node -e 'const a=require("/tmp/kopli-npm-audit.json"); console.log("Dependency vulnerabilities:", JSON.stringify(a.metadata?.vulnerabilities || {})); for (const [name, item] of Object.entries(a.vulnerabilities || {})) console.log(name, JSON.stringify({severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via?.map(v=>typeof v==="string"?v:{title:v.title,url:v.url})}));'
      - name: Lint
        run: npm run lint --if-present
      - name: TypeCheck
        run: npx tsc --noEmit
      - name: Test
        run: npm test --if-present
      - name: Build
        run: npm run build
